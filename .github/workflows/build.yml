- name: Deploy frontend
  uses: appleboy/scp-action@v1.0.0
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ec2-user
    key: ${{ secrets.SERVER_SSH_KEY }}
    port: 22
    source: "dist/*"
    target: "/var/www/bookstore-frontend"
    strip_components: 1

- name: Reload Nginx
  uses: appleboy/ssh-action@v1.2.2
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ec2-user
    key: ${{ secrets.SERVER_SSH_KEY }}
    port: 22
    script: |
      sudo systemctl reload nginx
